# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Rejudges stored generated paragraphs without running the writer again.
#
#   tools/rejudge-tests.py /tmp/generate.json corpus/rejudge/generate.json
#   npx promptfoo@0.123.1 eval -c promptfooconfig.generate.rejudge.yaml --no-cache -o /tmp/rejudge.json
description: Generation rejudge of stored paragraphs

commandLineOptions:
  repeat: 1
  maxConcurrency: 96
  cache: false

prompts:
  - file://prompts/passage.txt

providers:
  - id: echo
    label: rejudge

defaultTest:
  assert:
    - type: javascript
      value: file://graders/judge.js
      metric: comply_clean
      config:
        kind: comply
        prompt: prompts/comply-json.txt
        mode: whole
        passes: 3
        max_procs: 96
        source_var: passage

derivedMetrics:
  - name: clean_maj_rate
    value: cmp_clean_maj / cmp_judged
  - name: clean_union_rate
    value: cmp_clean_union / cmp_judged
  - name: clean_pass_rate
    value: cmp_pass_clean / cmp_passes
  - name: pass_agree_rate
    value: cmp_pass_agree / cmp_judged
  - name: viol_maj_rate
    value: cmp_viol_maj / cmp_judged
  - name: over_maj_rate
    value: cmp_over_maj / cmp_judged

tests: file://corpus/rejudge/generate.json
