# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# Rejudges stored rewrites without running the writer again.
#
#   tools/rejudge-tests.py /tmp/comply.json corpus/rejudge/comply.json
#   npx promptfoo@0.123.1 eval -c promptfooconfig.comply.rejudge.yaml --no-cache -o /tmp/rejudge.json
description: Compliance rejudge of stored rewrites

commandLineOptions:
  repeat: 1
  maxConcurrency: 96
  cache: false

prompts:
  - file://prompts/passage.txt

providers:
  - id: echo
    label: rejudge

defaultTest:
  assert:
    - type: javascript
      value: file://graders/judge.js
      metric: comply_clean
      config:
        kind: comply
        prompt: prompts/comply-json.txt
        mode: whole
        passes: 3
        max_procs: 96
        source_var: passage
        class_var: expect

derivedMetrics:
  - name: clean_maj_rate
    value: cmp_clean_maj / cmp_judged
  - name: clean_union_rate
    value: cmp_clean_union / cmp_judged
  - name: clean_pass_rate
    value: cmp_pass_clean / cmp_passes
  - name: pass_agree_rate
    value: cmp_pass_agree / cmp_judged
  - name: viol_maj_rate
    value: cmp_viol_maj / cmp_judged
  - name: over_maj_rate
    value: cmp_over_maj / cmp_judged
  - name: clean_rate_good
    value: cmp_clean_maj_good / cmp_judged_good
  - name: clean_rate_mixed
    value: cmp_clean_maj_mixed / cmp_judged_mixed
  - name: clean_rate_slop
    value: cmp_clean_maj_slop / cmp_judged_slop

tests: file://corpus/rejudge/comply.json
