# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# The compliance loop. A paragraph from corpus/comply.csv goes in, the writer in
# providers/writer.py rewrites it with the clanker-prose plugin and writes notes to a
# file, and graders/judge.js grades the edit three times against the contract.
#
#   npx promptfoo@0.123.1 eval -c promptfooconfig.comply.yaml --no-cache -o /tmp/comply.json
#   tools/comply-report.py /tmp/comply.json
#
# JUDGE_MODE=groups splits every pass into one call per bullet-groups.json group plus a
# remainder. Headline numbers use --repeat 3.
description: Compliance loop, prose skill rewrites then a JSON judge grades against the contract

commandLineOptions:
  repeat: 1
  maxConcurrency: 96
  cache: false

prompts:
  - file://prompts/passage.txt

providers:
  - id: file://providers/writer.py
    label: comply
    config:
      task: rewrite
      workers: 96
      timeout: 600000

defaultTest:
  assert:
    - type: javascript
      value: file://graders/judge.js
      metric: comply_clean
      config:
        kind: comply
        prompt: prompts/comply-json.txt
        mode: whole
        passes: 3
        max_procs: 96
        source_var: passage
        class_var: expect

derivedMetrics:
  - name: clean_maj_rate
    value: cmp_clean_maj / cmp_judged
  - name: clean_union_rate
    value: cmp_clean_union / cmp_judged
  - name: clean_pass_rate
    value: cmp_pass_clean / cmp_passes
  - name: pass_agree_rate
    value: cmp_pass_agree / cmp_judged
  - name: viol_maj_rate
    value: cmp_viol_maj / cmp_judged
  - name: over_maj_rate
    value: cmp_over_maj / cmp_judged
  - name: clean_rate_good
    value: cmp_clean_maj_good / cmp_judged_good
  - name: clean_rate_mixed
    value: cmp_clean_maj_mixed / cmp_judged_mixed
  - name: clean_rate_slop
    value: cmp_clean_maj_slop / cmp_judged_slop

tests: file://corpus/comply.csv
