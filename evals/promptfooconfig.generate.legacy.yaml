# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# The generation loop. A fact sheet goes in, a writer composes a paragraph under
# the prose contract, and a judge holding the contract text grades the paragraph
# against the sheet.
#
# This is promptfooconfig.comply.yaml's counterpart for composition. The compliance
# loop only ever measures a rewrite of prose that already exists, so it cannot
# catch a rule that only bites during first-draft composition, nor can it check
# for an invented or dropped fact the way a fact sheet makes checkable. See
# CLAUDE.md and providers/generate-then-comply.sh for the mechanics; they are the
# same isolation and the same judge prompt as the compliance loop, unmodified.
#
#   npx promptfoo@latest eval -c promptfooconfig.generate.yaml -o /tmp/generate.json
#   tools/comply-report.py /tmp/generate.json
#
# Same cost profile as the compliance loop: the judge carries the whole contract,
# so budget --filter-first-n and --repeat 1 for a first look.
description: Generation loop, a writer composes from a fact sheet then a judge grades against the contract

commandLineOptions:
  repeat: 3
  maxConcurrency: 96

prompts:
  - file://prompts/passage.txt

providers:
  - id: exec:./providers/generate-then-comply.sh
    label: generate

defaultTest:
  assert:
    - type: contains
      value: "VERDICT violations="

tests:
  - file://cases/generate.csv
